<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game | HPSA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="game">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <h1 id="game-title">Game</h1>
        <p class="page-sub" id="game-sub"></p>
      </div>
    </section>
    <div class="stitch" aria-hidden="true"></div>

    <div class="content">
      <div class="wrap">
        <p class="notice" id="sample-note" hidden>You are looking at sample data. Add this team's sheet links in config.js to show real stats.</p>
        <div id="game-view"><p class="empty">Loading game&hellip;</p></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="config.js"></script>
  <script src="sample-data.js"></script>
  <script src="site.js"></script>
</body>
</html>
